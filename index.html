<style>
  :root { --cyan:#2ff3ff; --mag:#ff2fb4; --sun:#ffd23f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#07020f; color:#fff;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:24px; transition:opacity .6s ease; z-index:5; }
  .hidden { opacity:0; pointer-events:none; }
  .logo { font-weight:900; font-style:italic; letter-spacing:.06em; line-height:.85; font-size:clamp(56px,13vw,150px);
    display:flex; flex-direction:column; align-items:center; filter:drop-shadow(0 0 24px rgba(255,47,180,.55)); }
  .logo span:first-child { color:transparent; -webkit-text-stroke:2px var(--cyan); text-shadow:0 0 18px var(--cyan); }
  .logo span:last-child { background:linear-gradient(180deg,#fff 0%,var(--sun) 35%,var(--mag) 75%,#7a1cff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:flick 4s infinite; }
  @keyframes flick { 0%,92%,100%{opacity:1} 93%{opacity:.4} 94%{opacity:1} 96%{opacity:.6} }
  .tag { font-size:clamp(14px,2.2vw,19px); letter-spacing:.25em; text-transform:uppercase; color:#d9c8ff; opacity:.9; }
  button.big { font:inherit; font-weight:800; font-size:clamp(18px,3vw,26px); letter-spacing:.3em; padding:16px 46px 16px 52px;
    color:#fff; background:linear-gradient(90deg,rgba(47,243,255,.18),rgba(255,47,180,.25)); border:2px solid var(--cyan);
    border-radius:6px; cursor:pointer; box-shadow:0 0 22px rgba(47,243,255,.5), inset 0 0 18px rgba(255,47,180,.35);
    animation:pulse 1.6s ease-in-out infinite; }
  button.big:hover { background:linear-gradient(90deg,rgba(47,243,255,.35),rgba(255,47,180,.45)); }
  @keyframes pulse { 50% { box-shadow:0 0 40px rgba(47,243,255,.85), inset 0 0 26px rgba(255,47,180,.55); } }
  button.small { font:inherit; font-size:14px; letter-spacing:.15em; padding:10px 18px; color:#fff; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.35); border-radius:6px; cursor:pointer; }
  .how { font-size:13px; line-height:1.7; color:#bfb3e6; letter-spacing:.06em; }
  .best { font-size:13px; letter-spacing:.2em; color:var(--sun); }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:3; opacity:0; transition:opacity .4s; }
  #hud.on { opacity:1; }
  #score { position:absolute; left:max(18px,env(safe-area-inset-left)); top:14px; font-size:clamp(26px,5vw,44px); font-weight:900;
    font-variant-numeric:tabular-nums; text-shadow:0 0 14px var(--cyan); }
  #mult { position:absolute; left:max(20px,env(safe-area-inset-left)); top:clamp(50px,9vw,66px); font-size:16px; font-weight:800; color:var(--sun);
    letter-spacing:.15em; text-shadow:0 0 10px var(--sun); }
  #speed { position:absolute; right:max(18px,env(safe-area-inset-right)); top:14px; text-align:right; font-size:clamp(22px,4vw,34px); font-weight:900;
    font-variant-numeric:tabular-nums; text-shadow:0 0 14px var(--mag); }
  #speed small { display:block; font-size:11px; letter-spacing:.3em; opacity:.7; }
  #shields { position:absolute; left:50%; top:18px; transform:translateX(-50%); display:flex; gap:8px; }
  #shields i { width:26px; height:8px; border-radius:2px; background:var(--cyan); box-shadow:0 0 10px var(--cyan); transition:all .3s; }
  #shields i.off { background:rgba(255,255,255,.12); box-shadow:none; }
  #popup { position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); font-size:clamp(20px,4vw,34px); font-weight:900;
    letter-spacing:.2em; color:#fff; text-shadow:0 0 18px var(--mag); opacity:0; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:4; background:radial-gradient(ellipse at center, rgba(255,40,80,0) 30%, rgba(255,30,90,.65) 100%); opacity:0; }
  #credit { position:fixed; right:12px; bottom:max(10px,env(safe-area-inset-bottom)); font-size:11px; letter-spacing:.12em; color:rgba(220,210,255,.55); z-index:6; pointer-events:none; }
  #mute { position:fixed; left:12px; bottom:max(10px,env(safe-area-inset-bottom)); z-index:6; padding:6px 10px; font-size:12px; }
  #over h2 { font-size:clamp(34px,7vw,64px); font-weight:900; font-style:italic; letter-spacing:.08em; color:var(--mag); text-shadow:0 0 24px var(--mag); }
  #finalScore { font-size:clamp(46px,10vw,96px); font-weight:900; font-variant-numeric:tabular-nums; text-shadow:0 0 24px var(--cyan); }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #toast { position:fixed; left:50%; bottom:60px; transform:translateX(-50%); background:rgba(20,10,40,.9); border:1px solid var(--cyan);
    padding:10px 18px; border-radius:6px; font-size:14px; z-index:9; opacity:0; transition:opacity .3s; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; background:#07020f;
    letter-spacing:.5em; font-size:13px; color:var(--cyan); transition:opacity .8s; }
  .draft { font-size:11px; letter-spacing:.3em; color:#ff9be0; border:1px solid rgba(255,47,180,.5); padding:3px 10px; border-radius:3px; }
</style>

{ "imports": {

</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- Le monde : une seule fonction de relief, partagée CPU et GPU ----------
const pathX = z => 70 * Math.sin(z * 0.0021) + 28 * Math.sin(z * 0.0063 + 1.3);
const halfW = z => 34 + 10 * Math.sin(z * 0.0043);
function terrainH(x, z) {
  const d = x - pathX(z), t = Math.max(Math.abs(d) - halfW(z), 0);
  let h = t * t * 0.045 + t * 0.6;
  h += (Math.sin(x * 0.05 + z * 0.03) * 6 + Math.sin(x * 0.13 - z * 0.071) * 3) * Math.min(t * 0.1, 1);
  h += 1.2 * Math.sin(x * 0.08) * Math.sin(z * 0.07) + 0.6 * Math.sin(x * 0.21 + z * 0.13);
  return h;
}
const GLSL_WORLD = `
float pathX(float z){ return 70.0*sin(z*0.0021) + 28.0*sin(z*0.0063+1.3); }
float halfW(float z){ return 34.0 + 10.0*sin(z*0.0043); }
float terrainH(vec2 p){
  float d = p.x - pathX(p.y);
  float t = max(abs(d) - halfW(p.y), 0.0);
  float h = t*t*0.045 + t*0.6;
  h += (sin(p.x*0.05 + p.y*0.03)*6.0 + sin(p.x*0.13 - p.y*0.071)*3.0) * min(t*0.1, 1.0);
  h += 1.2*sin(p.x*0.08)*sin(p.y*0.07) + 0.6*sin(p.x*0.21 + p.y*0.13);
  return h;
}`;

// ---------- Rendu ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.3, 2400);
const isTouch = matchMedia('(pointer: coarse)').matches;
const SUN_DIR = new THREE.Vector3(0, 0.1, -1).normalize();

scene.add(new THREE.HemisphereLight(0x9a5cff, 0x12002a, 0.9));
const sunLight = new THREE.DirectionalLight(0xff6ac8, 2.4);
sunLight.position.copy(SUN_DIR).multiplyScalar(-1).add(new THREE.Vector3(0, 1.2, 0)); // contre-jour léger
scene.add(sunLight);
const keyLight = new THREE.DirectionalLight(0x6fe8ff, 1.6); keyLight.position.set(0.4, 1, 1); scene.add(keyLight);

// Ciel : dégradé, soleil rayé, halo, étoiles, aurores
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uSun: { value: SUN_DIR }, uBeat: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: `
  varying vec3 vDir; uniform float uTime; uniform vec3 uSun; uniform float uBeat;
  float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
  void main(){
    vec3 d = normalize(vDir); float y = d.y;
    vec3 top = vec3(0.004,0.0,0.03), hor = vec3(0.20,0.015,0.24), low = vec3(0.06,0.0,0.12);
    vec3 col = y > 0.0 ? mix(hor, top, pow(smoothstep(0.0, 0.55, y), 0.7)) : mix(hor, low, smoothstep(0.0, 0.2, -y));
    // aurores
    float a = sin(d.x*6.0 + uTime*0.3)*0.5 + sin(d.x*13.0 - uTime*0.21 + d.z*4.0)*0.5;
    float band = exp(-pow((y - 0.32 - a*0.05)*14.0, 2.0));
    col += band * mix(vec3(0.0,0.9,0.8), vec3(0.6,0.1,1.0), 0.5+0.5*sin(d.x*3.0+uTime*0.2)) * 0.35;
    // étoiles
    vec3 sp = floor(d*360.0); float h = hash(sp);
    col += step(0.9982, h) * smoothstep(0.04, 0.3, y) * vec3(0.85,0.9,1.0) * (0.55 + 0.45*sin(uTime*3.0 + h*90.0)) * 1.6;
    // soleil
    float sa = acos(clamp(dot(d, uSun), -1.0, 1.0));
    float R = 0.24;
    col += vec3(1.0,0.18,0.55) * exp(-sa*3.2) * (0.55 + 0.25*uBeat);
    if (sa < R) {
      float sy = (d.y - uSun.y) / R;
      vec3 sc = mix(vec3(1.0,0.12,0.6), vec3(1.0,0.86,0.25), smoothstep(-0.9, 0.7, sy));
      float stripes = sy < 0.15 ? step(0.0, sin(sy*38.0 - uTime*1.6) + (sy+0.9)*0.9) : 1.0;
      float edge = smoothstep(R, R*0.94, sa);
      col = mix(col, sc*2.2, stripes*edge);
    }
    gl_FragColor = vec4(col, 1.0);
  }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -1;
scene.add(sky);

// Terrain : une grille qui suit la caméra, relief calculé dans le vertex shader
const CELL = 3.75;
const terrainGeo = new THREE.PlaneGeometry(CELL * 170, CELL * 250, 170, 250);
terrainGeo.rotateX(-Math.PI / 2);
terrainGeo.translate(0, 0, -CELL * 250 * 0.38);
const terrainMat = new THREE.ShaderMaterial({
  uniforms: { uOff: { value: new THREE.Vector2() }, uCam: { value: new THREE.Vector3() }, uTime: { value: 0 }, uBeat: { value: 0 },
    uFog: { value: new THREE.Color(0.20, 0.015, 0.24) }, uSun: { value: SUN_DIR } },
  vertexShader: GLSL_WORLD + `
  uniform vec2 uOff; varying vec3 vW; varying vec3 vN; varying float vT;
  void main(){
    vec2 p = position.xz + uOff;
    float h = terrainH(p); float e = 0.9;
    vN = normalize(vec3(terrainH(p - vec2(e,0.0)) - terrainH(p + vec2(e,0.0)), 2.0*e, terrainH(p - vec2(0.0,e)) - terrainH(p + vec2(0.0,e))));
    vW = vec3(p.x, h, p.y);
    vT = max(abs(p.x - pathX(p.y)) - halfW(p.y), 0.0);
    gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0);
  }`,
  fragmentShader: GLSL_WORLD + `
  uniform vec3 uCam; uniform float uTime; uniform float uBeat; uniform vec3 uFog; uniform vec3 uSun;
  varying vec3 vW; varying vec3 vN; varying float vT;
  float gridLine(vec2 g){ vec2 w = abs(fract(g - 0.5) - 0.5) / fwidth(g); return 1.0 - min(min(w.x, w.y), 1.0); }
  void main(){
    vec3 n = normalize(vN);
    float wall = smoothstep(0.5, 7.0, vT);
    vec3 base = mix(vec3(0.02,0.006,0.06), vec3(0.05,0.012,0.10), wall);
    float diff = max(dot(n, normalize(vec3(0.3, 0.8, -0.5))), 0.0);
    float rim = pow(1.0 - max(dot(n, normalize(uCam - vW)), 0.0), 3.0);
    vec3 col = base * (0.35 + 1.1*diff) + vec3(0.5,0.1,0.8) * rim * wall * 0.12;
    float pulse = 0.75 + 0.7*uBeat;
    float line = gridLine(vW.xz / 7.5);
    float wave = pow(0.5 + 0.5*sin(vW.z*0.045 + uTime*7.0), 10.0);
    col += vec3(0.0,0.85,1.0) * line * (1.0 - wall) * (0.8*pulse + wave*2.2);
    float hc = vW.y / 9.0; float cw = abs(fract(hc - 0.5) - 0.5) / fwidth(hc);
    col += vec3(1.0,0.12,0.7) * (1.0 - min(cw, 1.0)) * wall * 0.9 * pulse;
    float dc = abs(vW.x - pathX(vW.z));
    col += vec3(0.55,0.1,1.0) * exp(-dc*0.18) * (0.25 + 0.6*wave);
    float dist = length(vW - uCam);
    float fog = 1.0 - exp(-pow(dist * 0.0021, 1.7));
    col = mix(col, uFog, clamp(fog, 0.0, 1.0));
    gl_FragColor = vec4(col, 1.0);
  }`
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.frustumCulled = false;
scene.add(terrain);

// ---------- Vaisseau ----------
const ship = new THREE.Group();
{
  const hull = new THREE.MeshStandardMaterial({ color: 0x2a2346, metalness: 0.55, roughness: 0.32, flatShading: true });
  const neon = new THREE.LineBasicMaterial({ color: new THREE.Color(0.3, 1.6, 2.0) });
  const add = (geo, mat = hull, edges = true) => {
    const m = new THREE.Mesh(geo, mat); ship.add(m);
    if (edges) ship.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), neon));
    return m;
  };
  const body = new THREE.ConeGeometry(0.62, 4.2, 6); body.rotateX(-Math.PI / 2); body.scale(1, 0.55, 1); add(body);
  const wing = new THREE.BoxGeometry(6.2, 0.09, 1.5, 6, 1, 1);
  const wp = wing.attributes.position;
  for (let i = 0; i < wp.count; i++) { const x = wp.getX(i); wp.setZ(i, wp.getZ(i) + Math.abs(x) * 0.5 + 0.4); wp.setY(i, wp.getY(i) + Math.abs(x) * 0.07); }
  wing.computeVertexNormals(); add(wing);
  for (const s of [-1, 1]) {
    const fin = new THREE.BoxGeometry(0.07, 0.95, 1.1); fin.translate(0, 0.45, 0); fin.rotateZ(-s * 0.35); fin.translate(s * 1.15, 0.05, 1.3); add(fin);
    const eng = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 8); eng.rotateX(Math.PI / 2); eng.translate(s * 0.62, -0.05, 1.5); add(eng);
  }
  const cock = new THREE.SphereGeometry(0.42, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2); cock.scale(0.7, 0.5, 1.8); cock.translate(0, 0.12, -0.4);
  add(cock, new THREE.MeshStandardMaterial({ color: 0x0a2a44, emissive: new THREE.Color(0.1, 0.6, 1.2), metalness: 0.9, roughness: 0.1 }), false);
}
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.6)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();
const engines = [];
for (const s of [-1, 1]) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(1.6, 0.5, 1.5), blending: THREE.AdditiveBlending, depthWrite: false }));
  sp.position.set(s * 0.62, -0.05, 2.35); sp.scale.setScalar(1.4); ship.add(sp); engines.push(sp);
}
scene.add(ship);

// ---------- Particules (traînée + explosions) ----------
const PMAX = 1600;
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), pSize = new Float32Array(PMAX);
const pVel = new Float32Array(PMAX * 3), pLife = new Float32Array(PMAX), pMax = new Float32Array(PMAX), pBase = new Float32Array(PMAX * 3);
let pHead = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uPR: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute vec3 aColor; attribute float aSize; uniform float uPR; varying vec3 vC;
    void main(){ vC = aColor; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uPR * 320.0 / max(-mv.z, 0.1); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying vec3 vC; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); gl_FragColor = vec4(vC * a * a, a); }`
});
const particles = new THREE.Points(pGeo, pMat); particles.frustumCulled = false; scene.add(particles);
function emit(x, y, z, vx, vy, vz, life, r, g, b, size) {
  const i = pHead; pHead = (pHead + 1) % PMAX;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pLife[i] = pMax[i] = life; pBase[i * 3] = r; pBase[i * 3 + 1] = g; pBase[i * 3 + 2] = b; pSize[i] = size;
}
function updateParticles(dt) {
  for (let i = 0; i < PMAX; i++) {
    if (pLife[i] <= 0) { pSize[i] = 0; continue; }
    pLife[i] -= dt;
    const k = Math.max(pLife[i] / pMax[i], 0);
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    pVel[i * 3] *= 0.97; pVel[i * 3 + 1] = pVel[i * 3 + 1] * 0.97 - 6 * dt; pVel[i * 3 + 2] *= 0.97;
    pCol[i * 3] = pBase[i * 3] * k; pCol[i * 3 + 1] = pBase[i * 3 + 1] * k; pCol[i * 3 + 2] = pBase[i * 3 + 2] * k;
    if (pLife[i] <= 0) pSize[i] = 0;
  }
  pGeo.attributes.position.needsUpdate = pGeo.attributes.aColor.needsUpdate = pGeo.attributes.aSize.needsUpdate = true;
}
function burst(p, n, power, palette) {
  for (let j = 0; j < n; j++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u), sp = power * (0.3 + Math.random());
    const c = palette[j % palette.length];
    emit(p.x, p.y, p.z, s * Math.cos(th) * sp, u * sp + power * 0.2, s * Math.sin(th) * sp, 0.8 + Math.random() * 1.4, c[0], c[1], c[2], 0.5 + Math.random() * 1.2);
  }
}

// ---------- Lignes de vitesse ----------
const SL = 160;
const slPos = new Float32Array(SL * 6), slCol = new Float32Array(SL * 6), slData = [];
for (let i = 0; i < SL; i++) {

    if (!ix && !iy && input.ptr) {

    const floor = terrainH(S.x, S.z);

  // anneaux
  for (const g of gates) {
    if (!g.done && S.z < g.z) {
      g.done = true;
      const dx = S.x - g.g.position.x, dy = S.y - g.g.position.y;
      if (dx * dx + dy * dy < 6.2 * 6.2) {
        g.fade = 1;
        if (playing) {
          S.streak++; const mult = 1 + Math.min(S.streak, 16) * 0.25;
          S.score += 250 * mult; S.speed += 5; Audio.gate(S.streak);
          popup(S.streak > 1 ? `ANNEAU x${mult.toFixed(2).replace(/\.?0+$/, '')}` : 'ANNEAU');
          burst(g.g.position, 90, 30, [[0.4, 2.6, 3.4], [3.2, 0.5, 2.4]]);
        }
      } else if (playing) { S.streak = 0; }
    }
    if (g.fade > 0) { g.fade -= dt * 1.6; const k = Math.max(g.fade, 0); g.g.scale.setScalar(1 + (1 - k) * 1.6); g.m.opacity = g.m2.opacity = k; g.halo.material.opacity = k; }
    g.inner.rotation.z += dt * 2.5;
    if (g.z > S.z + 30) placeGate(g);
  }
  for (const c of crys) if (c.z > S.z + 30) placeCrystal(c);
  updateCrystals(dt);
  S.inv = Math.max(S.inv - dt, 0); S.shake = Math.max(S.shake - rdt * 2.5, 0); S.hit = Math.max(S.hit - rdt * 2, 0);

  // vaisseau
  bank += ((-S.vx / latMax) * 0.9 - bank) * Math.min(dt * 6, 1);
  pitch += ((S.vy / 24) * 0.35 - pitch) * Math.min(dt * 6, 1);
  ship.position.set(S.x, S.y, S.z);
  ship.rotation.set(pitch, -S.vx / latMax * 0.25, bank);
  ship.visible = S.mode !== 'dying' && !(S.inv > 0 && playing && Math.floor(S.t * 18) % 2 === 0);
  const beat = Audio.beat();
  for (const e of engines) e.scale.setScalar(0.8 + Math.random() * 0.25 + S.speed / 600);
  if (ship.visible) for (const e of engines) {
    const w = e.getWorldPosition(_p);
    emit(w.x, w.y, w.z, (Math.random() - .5) * 2, (Math.random() - .5) * 2, 8 + Math.random() * 6, 0.3 + Math.random() * 0.2, 0.9, 0.3, 1.7, 0.4);
  }
  updateParticles(dt);

  // caméra
  const sf = THREE.MathUtils.clamp((S.speed - 80) / 190, 0, 1);
  let off;
  if (playing || S.mode === 'dying') off = new THREE.Vector3(0, 3.4 + S.vy * 0.03, 12 - sf * 2);
  else { const a = S.t * 0.18; off = new THREE.Vector3(Math.sin(a) * 10, 3.2 + Math.sin(S.t * 0.31) * 1.5, Math.cos(a) * 9 + 3); }
  const want = new THREE.Vector3(S.x, S.y, S.z).add(off);
  camPos.lerp(want, Math.min(rdt * (playing ? 7 : 2.2), 1));
  if (playing) camPos.z = want.z + (camPos.z - want.z) * 0.2;
  camera.position.copy(camPos);
  if (S.shake > 0) camera.position.add(new THREE.Vector3((Math.random() - .5), (Math.random() - .5), 0).multiplyScalar(S.shake * 1.2));
  camLook.set(S.x, S.y + (playing || S.mode === 'dying' ? 0.8 : 4.2), S.z - (playing ? 22 : 4));
  camera.lookAt(camLook);
  camera.rotateZ(bank * 0.35);
  camera.fov = 68 + sf * 18 + S.hit * 6; camera.updateProjectionMatrix();
  sky.position.copy(camera.position);

  // terrain qui suit
  terrainMat.uniforms.uOff.value.set(Math.round(camera.position.x / CELL) * CELL, Math.round(camera.position.z / CELL) * CELL);
  terrainMat.uniforms.uCam.value.copy(camera.position);
  terrainMat.uniforms.uTime.value = S.t; terrainMat.uniforms.uBeat.value = beat;
  skyMat.uniforms.uTime.value = S.t; skyMat.uniforms.uBeat.value = beat;

  // lignes de vitesse
  const slen = 4 + S.speed * 0.07, sOp = playing ? 0.25 + sf * 0.75 : 0.15;
  slMat.opacity = sOp;
  for (let i = 0; i < SL; i++) {
    const d = slData[i]; d.z += S.speed * rdt * 1.2;
    if (d.z > 12) { d.z -= 170; d.a = Math.random() * Math.PI * 2; d.r = 5 + Math.random() * 22; }
    const x = camera.position.x + Math.cos(d.a) * d.r, y = camera.position.y + Math.sin(d.a) * d.r * 0.7, z = camera.position.z + d.z - 10;
    slPos.set([x, y, z, x, y, z + slen], i * 6);
  }
  slGeo.attributes.position.needsUpdate = true;

  finalPass.uniforms.uAmt.value = 0.0015 + sf * 0.0035; finalPass.uniforms.uBlur.value = playing ? sf * 0.035 : 0.004;
  finalPass.uniforms.uTime.value = S.t; finalPass.uniforms.uHit.value = S.hit;
  bloom.strength = 0.6 + beat * 0.2 + S.hit * 0.6;
  ui.flash.style.opacity = S.hit * 0.9;

  // HUD
  if (playing) {
    ui.score.textContent = Math.floor(S.score).toLocaleString('fr-FR');
    const m = 1 + Math.min(S.streak, 16) * 0.25; ui.mult.textContent = 'x' + m.toFixed(2).replace(/\.?0+$/, '');
    ui.speed.firstChild.nodeValue = Math.round(S.speed * 9.5);
  }
  if (popT > 0) { popT -= rdt; ui.popup.style.opacity = Math.min(popT * 3, 1); ui.popup.style.transform = `translate(-50%,-50%) scale(${1 + (0.9 - popT) * 0.3})`; }
}

function frame(now) {
  const rdt = Math.min((now - last) / 1000, 0.05); last = now;
  step(rdt);
  composer.render(rdt);
  qualityTick(rdt);
  if (!loaded) { loaded = true; const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 900); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { S, get quality() { return qLevel; }, startGame, step };
</script>
<script>
addEventListener('error', e => { const l = document.getElementById('loading'); if (l) l.textContent = 'ERREUR : ' + (e.message || 'WebGL indisponible'); });
</script>
</body>
